<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Validation Test Harness</title>

  <!-- Bootstrap (same as app) -->
  <link rel="stylesheet" href="../css/bootstrap.min.css" />

  <style>
    body {
      padding: 2rem;
      background: #f8f9fa;
    }

    .test-card {
      margin-bottom: 2rem;
    }
  </style>
</head>

<body>

  <h2 class="mb-4">Form Validation Test Harness</h2>

  <!-- REGISTER TEST -->
  <div class="card test-card">
    <div class="card-header">Register Form</div>
    <div class="card-body">
      <form id="register-test" novalidate>
        <div class="mb-3">
          <label>Name</label>
          <input class="form-control" name="name" required />
        </div>

        <div class="mb-3">
          <label>Email</label>
          <input class="form-control" type="email" name="email" required />
        </div>

        <div class="mb-3">
          <label>Password</label>
          <input class="form-control" type="password" name="password" required />
        </div>

        <div class="mb-3">
          <label>Repeat Password</label>
          <input class="form-control" type="password" name="repeat_password" required />
        </div>

        <div class="mb-3">
          <label>Level</label>
          <select class="form-select" name="level" required>
            <option value="">Choose</option>
            <option>Senior</option>
            <option>Mid</option>
            <option>Junior</option>
            <option>Admin</option>
          </select>
        </div>

        <button class="btn btn-primary">Submit</button>
      </form>
    </div>
  </div>

  <!-- LOGIN TEST -->
  <div class="card test-card">
    <div class="card-header">Login Form</div>
    <div class="card-body">
      <form id="login-test" novalidate>
        <div class="mb-3">
          <label>Login (name or email)</label>
          <input class="form-control" name="login" required />
        </div>

        <div class="mb-3">
          <label>Password</label>
          <input class="form-control" type="password" name="password" required />
        </div>

        <button class="btn btn-primary">Submit</button>
      </form>
    </div>
  </div>

  <!-- CHANGE PASSWORD TEST -->
  <div class="card test-card">
    <div class="card-header">Change Password</div>
    <div class="card-body">
      <form id="change-password-test" novalidate>
        <div class="mb-3">
          <label>Old Password</label>
          <input class="form-control" type="password" name="old_password" required />
        </div>

        <div class="mb-3">
          <label>New Password</label>
          <input class="form-control" type="password" name="new_password" required />
        </div>

        <div class="mb-3">
          <label>Repeat New Password</label>
          <input class="form-control" type="password" name="repeat_new_password" required />
        </div>

        <button class="btn btn-primary">Submit</button>
      </form>
    </div>
  </div>

  <!-- JS -->
  <script type="module">
    import { validateForm } from "./validation.js";

    document.querySelectorAll("form").forEach((form) => {
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const ok = validateForm(form);
        console.log(form.id, "=>", ok ? "VALID" : "INVALID");
      });
    });
  </script>
</body>

</html>
